<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>가전 배송환경 및 양중비 관제 System</title>
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --text: #1f2937; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 60px; }
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 18px; font-weight: 700; color: var(--primary); }
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 55px; z-index: 90; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; font-size: 15px; font-weight: 600; color: #6b7280; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .container { padding: 15px; display: none; }
        .container.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #4b5563; }
        .form-group label span { color: #ef4444; margin-left: 2px; }
        input[type="text"], input[type="date"], input[type="number"], input[type="password"], select, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: #fff; }
        textarea { resize: vertical; height: 70px; }
        .dynamic-rows { background: #f9fafb; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 10px; }
        .total-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 8px; font-weight: bold; text-align: right; color: #1e40af; margin-bottom: 15px; }
        .photo-upload { border: 2px dashed #d1d5db; border-radius: 8px; padding: 20px; text-align: center; background: #fff; cursor: pointer; position: relative; }
        .photo-upload input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        #photo-preview { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        #photo-preview img { width: 100%; height: 80px; object-fit: cover; border-radius: 6px; }
        .submit-btn { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .submit-btn:disabled { background: #9ca3af; }
        .data-item { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 10px; }
        .data-item-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; font-size: 15px; }
        .img-grid { display: flex; gap: 5px; margin-top: 10px; }
        .img-grid img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
        .auth-box { background: #fff; padding: 30px 20px; border-radius: 8px; text-align: center; border: 1px solid #e5e7eb; margin-top: 20px; }
    </style>

    <!-- Firebase SDK 연동 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJdPArpj_i61crrpEomzpN73euuwh_X84",
            authDomain: "yang-delivery-system.firebaseapp.com",
            projectId: "yang-delivery-system",
            storageBucket: "yang-delivery-system.firebasestorage.app",
            messagingSenderId: "723188059505",
            appId: "1:723188059505:web:35818e40a9a88d34ef7ad0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.fbFunctions = { collection, addDoc, getDocs, query, orderBy };
    </script>
</head>
<body>

<header>
    <h1>가전 배송환경 및 양중비 관제 System</h1>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="openTab('input')">현장 입력 (기사님용)</button>
    <button class="tab-btn" onclick="openTab('dashboard')">조회 (관리자용)</button>
</div>

<!-- 기사님 입력 화면 -->
<div id="input-container" class="container active">
    <form id="delivery-form">
        <div class="form-group">
            <label>발생일<span>*</span></label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label>납품번호<span>*</span></label>
            <input type="text" id="delivery_id" placeholder="예: 7123456789" required>
        </div>
        <div class="form-group">
            <label>차량번호<span>*</span></label>
            <input type="text" id="car_id" placeholder="예: 대구81아1234" required>
        </div>
        <div class="form-group">
            <label>가옥구조<span>*</span></label>
            <select id="house_type" required>
                <option value="">선택</option>
                <option value="아파트">아파트</option>
                <option value="단독주택">단독주택</option>
                <option value="상가">상가</option>
                <option value="빌라">빌라</option>
                <option value="기타">기타</option>
            </select>
        </div>
        <div class="form-group">
            <label>지역<span>*</span></label>
            <input type="text" id="region" placeholder="예: 해운대구 우동" required>
        </div>
        <div class="form-group">
            <label>층수<span>*</span></label>
            <input type="number" id="floor" placeholder="예: 5" required>
        </div>
        
        <div class="form-group">
            <label>양중비청구 댓수 (1~10)<span>*</span></label>
            <select id="quantity" required onchange="renderItemRows()" onclick="renderItemRows()">
                <option value="">선택</option>
                <option value="1">1대</option>
                <option value="2">2대</option>
                <option value="3">3대</option>
                <option value="4">4대</option>
                <option value="5">5대</option>
                <option value="6">6대</option>
                <option value="7">7대</option>
                <option value="8">8대</option>
                <option value="9">9대</option>
                <option value="10">10대</option>
            </select>
        </div>

        <!-- 댓수별 동적 입력 영역 -->
        <div id="dynamic-items-container"></div>

        <div class="total-box" id="total-amount-box">
            총 합계금액: 0 원
        </div>

        <div class="form-group">
            <label>특수장비사용불가 (양중비 결제 상세 사유)<span>*</span></label>
            <textarea id="reason_detail" placeholder="상세내용" required></textarea>
        </div>
        <div class="form-group">
            <label>환경사진 업로드 (최대 3장)<span>*</span></label>
            <div class="photo-upload">
                <p>📷 사진 촬영 또는 파일 선택</p>
                <input type="file" id="photos" accept="image/*" multiple required>
            </div>
            <div id="photo-preview"></div>
        </div>
        <button type="submit" id="submit-btn" class="submit-btn">클라우드로 전송 및 등록</button>
    </form>
</div>

<!-- 관리자 조회 화면 -->
<div id="dashboard-container" class="container">
    <div id="auth-box" class="auth-box">
        <h3 style="margin-bottom: 15px; color: #1f2937;">🔒 관리자 인증</h3>
        <p style="margin-bottom: 15px; font-size: 14px; color: #6b7280;">관리자 비밀번호를 입력해주세요.</p>
        <input type="password" id="admin-pw" placeholder="비밀번호 입력" style="margin-bottom: 15px; text-align: center; font-size: 18px; letter-spacing: 3px;">
        <button class="submit-btn" onclick="checkPassword()">확인</button>
    </div>

    <div id="dashboard-content" style="display: none;">
        <button class="submit-btn" onclick="loadData()" style="margin-bottom:15px;">🔄 데이터 새로고침</button>
        <div id="data-list">데이터를 불러오는 중입니다...</div>
    </div>
</div>

<script>
    let compressedPhotos = [];

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    });

    function openTab(tabName) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName + '-container').classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function checkPassword() {
        const pw = document.getElementById('admin-pw').value;
        if (pw === '0530') {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';
            loadData();
        } else {
            alert('비밀번호가 틀렸습니다!');
            document.getElementById('admin-pw').value = '';
        }
    }

    function renderItemRows() {
        const qty = parseInt(document.getElementById('quantity').value) || 0;
        const container = document.getElementById('dynamic-items-container');
        
        // 이미 생성되어 있다면 중복 생성 방지
        if (container.children.length === qty) return;

        container.innerHTML = '';

        for (let i = 1; i <= qty; i++) {
            const div = document.createElement('div');
            div.className = 'dynamic-rows';
            div.innerHTML = `
                <label style="font-size:13px; font-weight:bold; color:#2563eb; margin-bottom:8px; display:block;">[ ${i}번째 제품 정보 ]</label>
                <div style="margin-bottom:8px;">
                    <input type="text" placeholder="모델명 입력 (예: RF85C9011AP)" class="item-model" required>
                </div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <input type="number" placeholder="제품무게 (kg)" class="item-weight" required>
                    </div>
                    <div style="flex:1;">
                        <input type="number" placeholder="결제금액 (원)" class="item-price" required oninput="calculateTotal()">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }
        calculateTotal();
    }

    // 추가로 값이 바뀔 때마다 확실하게 갱신되도록 이벤트 리스너 추가
    document.getElementById('quantity').addEventListener('change', renderItemRows);
    document.getElementById('quantity').addEventListener('blur', renderItemRows);

    function calculateTotal() {
        const priceInputs = document.querySelectorAll('.item-price');
        let total = 0;
        priceInputs.forEach(input => {
            const val = parseFloat(input.value) || 0;
            total += val;
        });
        document.getElementById('total-amount-box').innerText = `총 합계금액: ${total.toLocaleString()} 원`;
    }

    document.getElementById('photos').addEventListener('change', (e) => {
        const preview = document.getElementById('photo-preview');
        preview.innerHTML = '';
        compressedPhotos = [];

        const files = Array.from(e.target.files).slice(0, 3);
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                    compressedPhotos.push(dataUrl);

                    const previewImg = document.createElement('img');
                    previewImg.src = dataUrl;
                    preview.appendChild(previewImg);
                };
            };
            reader.readAsDataURL(file);
        });
    });

    document.getElementById('delivery-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = '안전하게 전송 중...';

        try {
