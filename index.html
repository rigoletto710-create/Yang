<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>가전 배송환경 및 양중비 관제 System</title>
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --text: #1f2937; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 60px; }
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 18px; font-weight: 700; color: var(--primary); }
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 55px; z-index: 90; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; font-size: 15px; font-weight: 600; color: #6b7280; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .container { padding: 15px; display: none; }
        .container.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #4b5563; }
        .form-group label span { color: #ef4444; margin-left: 2px; }
        input[type="text"], input[type="date"], input[type="number"], input[type="password"], select, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: #fff; }
        textarea { resize: vertical; height: 70px; }
        
        /* 댓수 선택 버튼 그리드 스타일 */
        .qty-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
        .qty-btn { padding: 10px 0; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; font-weight: bold; color: #4b5563; cursor: pointer; text-align: center; }
        .qty-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .dynamic-rows { background: #f9fafb; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 10px; }
        .total-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 8px; font-weight: bold; text-align: right; color: #1e40af; margin-bottom: 15px; }
        .photo-upload { border: 2px dashed #d1d5db; border-radius: 8px; padding: 20px; text-align: center; background: #fff; cursor: pointer; position: relative; }
        .photo-upload input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        #photo-preview { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        #photo-preview img { width: 100%; height: 80px; object-fit: cover; border-radius: 6px; }
        .submit-btn { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .submit-btn:disabled { background: #9ca3af; }
        .data-item { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 10px; }
        .data-item-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; font-size: 15px; }
        .img-grid { display: flex; gap: 5px; margin-top: 10px; }
        .img-grid img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; }
        .auth-box { background: #fff; padding: 30px 20px; border-radius: 8px; text-align: center; border: 1px solid #e5e7eb; margin-top: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-card { background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb; text-align: center; }
        .stat-card .title { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .stat-card .value { font-size: 15px; font-weight: bold; color: var(--primary); }
        .filter-box { background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 15px; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .filter-row:last-child { margin-bottom: 0; }
        .admin-btn-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .admin-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; color: #fff; }
        .btn-refresh { background: #4b5563; }
        .btn-excel { background: #059669; }
        
        #image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        #image-modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
    </style>

    <!-- Firebase SDK 연동 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJdPArpj_i61crrpEomzpN73euuwh_X84",
            authDomain: "yang-delivery-system.firebaseapp.com",
            projectId: "yang-delivery-system",
            storageBucket: "yang-delivery-system.firebasestorage.app",
            messagingSenderId: "723188059505",
            appId: "1:723188059505:web:35818e40a9a88d34ef7ad0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.fbFunctions = { collection, addDoc, getDocs, query, orderBy };
    </script>
</head>
<body>

<header>
    <h1>가전 배송환경 및 양중비 관제 System</h1>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="openTab('input')">현장 입력 (기사님용)</button>
    <button class="tab-btn" onclick="openTab('dashboard')">조회 (관리자용)</button>
</div>

<!-- 기사님 입력 화면 -->
<div id="input-container" class="container active">
    <form id="delivery-form">
        <div class="form-group">
            <label>발생일<span>*</span></label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label>납품번호<span>*</span></label>
            <input type="text" id="delivery_id" placeholder="예: 7123456789" required>
        </div>
        <div class="form-group">
            <label>차량번호<span>*</span></label>
            <input type="text" id="car_id" placeholder="예: 대구81아1234" required>
        </div>
        <div class="form-group">
            <label>가옥구조<span>*</span></label>
            <select id="house_type" required>
                <option value="">선택</option>
                <option value="아파트">아파트</option>
                <option value="단독주택">단독주택</option>
                <option value="상가">상가</option>
                <option value="빌라">빌라</option>
                <option value="기타">기타</option>
            </select>
        </div>
        <div class="form-group">
            <label>지역<span>*</span></label>
            <input type="text" id="region" placeholder="예: 해운대구 우동" required>
        </div>
        <div class="form-group">
            <label>층수<span>*</span></label>
            <input type="number" id="floor" placeholder="예: 5" required>
        </div>
        
        <div class="form-group">
            <label>양중비청구 댓수 선택<span>*</span></label>
            <input type="hidden" id="quantity" value="" required>
            <div class="qty-grid" id="qty-btn-container">
                <button type="button" class="qty-btn" onclick="selectQuantity(1)">1대</button>
                <button type="button" class="qty-btn" onclick="selectQuantity(2)">2대</button>
                <button type="button" class="qty-btn" onclick="selectQuantity(3)">3대</button>
                <button type="button" class="qty-btn" onclick="selectQuantity(4)">4대</button>
                <button type="button" class="qty-btn" onclick="selectQuantity(5)">5대</button>
                <button type="button" class="qty-btn" onclick="selectQuantity(6)">6대</button>
                <button type="button" class="qty-btn" onclick="selectQuantity(7)">7대</button>
                <button type="button" class="qty-btn" onclick="selectQuantity(8)">8대</button>
                <button type="button" class="qty-btn" onclick="selectQuantity(9)">9대</button>
                <button type="button" class="qty-btn" onclick="selectQuantity(10)">10대</button>
            </div>
        </div>

        <div id="dynamic-items-container"></div>

        <div class="total-box" id="total-amount-box">
            총 합계금액: 0 원
        </div>

        <div class="form-group">
            <label>특수장비사용불가 (양중비 결제 상세 사유)<span>*</span></label>
            <textarea id="reason_detail" placeholder="상세내용" required></textarea>
        </div>
        <div class="form-group">
            <label>환경사진 업로드 (최대 3장)<span>*</span></label>
            <div class="photo-upload">
                <p>📷 사진 촬영 또는 파일 선택</p>
                <input type="file" id="photos" accept="image/*" multiple required>
            </div>
            <div id="photo-preview"></div>
        </div>
        <button type="submit" id="submit-btn" class="submit-btn">클라우드로 전송 및 등록</button>
    </form>
</div>

<!-- 관리자 조회 화면 -->
<div id="dashboard-container" class="container">
    <div id="auth-box" class="auth-box">
        <h3 style="margin-bottom: 15px; color: #1f2937;">🔒 관리자 인증</h3>
        <p style="margin-bottom: 15px; font-size: 14px; color: #6b7280;">관리자 비밀번호를 입력해주세요.</p>
        <input type="password" id="admin-pw" placeholder="비밀번호 입력" style="margin-bottom: 15px; text-align: center; font-size: 18px; letter-spacing: 3px;" onkeydown="if(event.key==='Enter') checkPassword()">
        <button class="submit-btn" onclick="checkPassword()">확인</button>
    </div>

    <div id="dashboard-content" style="display: none;">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="title">조회 건수</div>
                <div class="value" id="stat-count">0건</div>
            </div>
            <div class="stat-card">
                <div class="title">총 청구금액</div>
                <div class="value" id="stat-total">0원</div>
            </div>
            <div class="stat-card">
                <div class="title">총 제품수</div>
                <div class="value" id="stat-qty">0대</div>
            </div>
        </div>

        <div class="filter-box">
            <div class="filter-row">
                <input type="text" id="filter-keyword" placeholder="납품번호, 차량번호, 지역 검색" oninput="filterData()" style="font-size: 14px; padding: 8px;">
            </div>
            <div class="filter-row">
                <input type="date" id="filter-start-date" onchange="filterData()" style="font-size: 14px; padding: 8px;">
                <input type="date" id="filter-end-date" onchange="filterData()" style="font-size: 14px; padding: 8px;">
            </div>
        </div>

        <div class="admin-btn-group">
            <button class="admin-btn btn-refresh" onclick="loadData()">🔄 새로고침</button>
            <button class="admin-btn btn-excel" onclick="exportExcel()">📊 엑셀 다운로드</button>
        </div>

        <div id="data-list">데이터를 불러오는 중입니다...</div>
    </div>
</div>

<!-- 이미지 확대 모달 -->
<div id="image-modal" onclick="closeModal()">
    <img id="modal-img" src="">
</div>

<script>
    let compressedPhotos = [];
    let allDeliveryData = [];

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    });

    function openTab(tabName) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName + '-container').classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function checkPassword() {
        const pw = document.getElementById('admin-pw').value;
        if (pw === '0530') {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';
            loadData();
        } else {
            alert('비밀번호가 틀렸습니다!');
            document.getElementById('admin-pw').value = '';
        }
    }

    function selectQuantity(num) {
        document.getElementById('quantity').value = num;
        
        // 버튼 활성화 디자인 토글
        const buttons = document.querySelectorAll('.qty-btn');
        buttons.forEach((btn, idx) => {
            if (idx + 1 === num) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        renderItemRows(num);
    }

    function renderItemRows(qty) {
        const container = document.getElementById('dynamic-items-container');
        container.innerHTML = '';

        for (let i = 1; i <= qty; i++) {
            const div = document.createElement('div');
            div.className = 'dynamic-rows';
            div.innerHTML = `
                <label style="font-size:13px; font-weight:bold; color:#2563eb; margin-bottom:8px; display:block;">[ ${i}번째 제품 정보 ]</label>
                <div style="margin-bottom:8px;">
                    <input type="text" placeholder="모델명 입력 (예: RF85C9011AP)" class="item-model" required>
                </div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <input type="number" placeholder="제품무게 (kg)" class="item-weight" required>
                    </div>
                    <div style="flex:1;">
                        <input type="number" placeholder="결제금액 (원)" class="item-price" required oninput="calculateTotal()">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }
        calculateTotal();
    }

    function calculateTotal() {
        const priceInputs = document.querySelectorAll('.item-price');
        let total = 0;
        priceInputs.forEach(input => {
            const val = parseFloat(input.value) || 0;
            total += val;
        });
        document.getElementById('total-amount-box').innerText = `총 합계금액: ${total.toLocaleString()} 원`;
    }

    document.getElementById('photos').addEventListener('change', (e) => {
        const preview = document.getElementById('photo-preview');
        preview.innerHTML = '';
        compressedPhotos = [];

        const files = Array.from(e.target.files).slice(0, 3);
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                    compressedPhotos.push(dataUrl);

                    const previewImg = document.createElement('img');
                    previewImg.src = dataUrl;
                    preview.appendChild(previewImg);
                };
            };
            reader.readAsDataURL(file);
        });
    });

    document.getElementById('delivery-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const qtyVal = document.getElementById('quantity').value;
        if (!qtyVal) {
            alert('양중비청구 댓수를 선택해주세요.');
            return;
        }

        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = '안전하게 전송 중...';

        try {
            const items = [];
            const modelInputs = document.querySelectorAll('.item-model');
            const weightInputs = document.querySelectorAll('.item-weight');
            const priceInputs = document.querySelectorAll('.item-price');
            let totalPrice = 0;

            for(let i=0; i<modelInputs.length; i++) {
                const m = modelInputs[i].value;
                const w = weightInputs[i].value;
                const p = parseFloat(priceInputs[i].value) || 0;
                totalPrice += p;
                items.push({ model: m, weight: w, price: p });
            }

            const { collection, addDoc } = window.fbFunctions;
            await addDoc(collection(window.db, "deliveries"), {
                date: document.getElementById('date').value,
                delivery_id: document.getElementById('delivery_id').value,
                car_id: document.getElementById('car_id').value,
                house_type: document.getElementById('house_type').value,
                region: document.getElementById('region').value,
                floor: document.getElementById('floor').value,
                quantity: qtyVal,
                items: items,
                totalPrice: totalPrice,
                reason_detail: document.getElementById('reason_detail').value,
                photos: compressedPhotos,
                createdAt: new Date()
            });

            alert('성공적으로 저장되었습니다!');
            e.target.reset();
            document.getElementById('quantity').value = '';
            document.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('dynamic-items-container').innerHTML = '';
            document.getElementById('total-amount-box').innerText = '총 합계금액: 0 원';
            document.getElementById('photo-preview').innerHTML = '';
            compressedPhotos = [];
        } catch (err) {
            console.error(err);
            alert('업로드 실패: ' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = '클라우드로 전송 및 등록';
        }
    });

    async function loadData() {
        const list = document.getElementById('data-list');
        list.innerHTML = '불러오는 중...';

        try {
            const { collection, getDocs, query, orderBy } = window.fbFunctions;
            const q = query(collection(window.db, "deliveries"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);

            allDeliveryData = [];
            querySnapshot.forEach((doc) => {
                allDeliveryData.push(doc.data());
            });

            renderDataList(allDeliveryData);
        } catch (err) {
            list.innerHTML = '데이터 로딩 실패: ' + err.message;
        }
    }

    function renderDataList(dataArray) {
        const list = document.getElementById('data-list');
        list.innerHTML = '';

        if (dataArray.length === 0) {
            list.innerHTML = '등록된 데이터가 없습니다.';
            updateStats(dataArray);
            return;
        }

        dataArray.forEach((data) => {
            const el = document.createElement('div');
            el.className = 'data-item';
            
            let itemsHtml = '';
            if(data.items && data.items.length > 0) {
                itemsHtml = data.items.map((item, idx) => `&nbsp;&nbsp;- ${idx+1}번: [${item.model}] 무게 ${item.weight}kg / 금액 ${Number(item.price).toLocaleString()}원<br>`).join('');
            }

            el.innerHTML = `
                <div class="data-item-header">
                    <span>납품번호: ${data.delivery_id} (${data.car_id})</span>
                    <span>${data.date}</span>
                </div>
                <p><b>지역:</b> ${data.region} (${data.house_type} ${data.floor}층)</p>
                <p><b>청구 대수:</b> 총 ${data.quantity}대</p>
                <p><b>제품별 상세 내역:</b><br>${itemsHtml}</p>
                <p style="color:#2563eb; font-weight:bold;"><b>총 합계금액:</b> ${Number(data.totalPrice || 0).toLocaleString()} 원</p>
                <p><b>특수장비사용불가 사유:</b> ${data.reason_detail}</p>
                <div class="img-grid">
                    ${(data.photos || []).map(url => `<img src="${url}" onclick="openModal('${url}')">`).join('')}
                </div>
            `;
            list.appendChild(el);
        });

        updateStats(dataArray);
    }

    function updateStats(dataArray) {
        let totalCount = dataArray.length;
        let totalPrice = 0;
        let totalQty = 0;

        dataArray.forEach(d => {
            totalPrice += Number(d.totalPrice || 0);
            totalQty += parseInt(d.quantity || 0);
        });

        document.getElementById('stat-count').innerText = `${totalCount}건`;
        document.getElementById('stat-total').innerText = `${totalPrice.toLocaleString()}원`;
        document.getElementById('stat-qty').innerText = `${totalQty}대`;
    }

    function filterData() {
        const keyword = document.getElementById('filter-keyword').value.toLowerCase();
        const startDate = document.getElementById('filter-start-date').value;
        const endDate = document.getElementById('filter-end-date').value;

        const filtered = allDeliveryData.filter(item => {
            const matchKeyword = !keyword || 
                (item.delivery_id && item.delivery_id.toLowerCase().includes(keyword)) ||
                (item.car_id && item.car_id.toLowerCase().includes(keyword)) ||
                (item.region && item.region.toLowerCase().includes(keyword));

            const matchStart = !startDate || item.date >= startDate;
            const matchEnd = !endDate || item.date <= endDate;

            return matchKeyword && matchStart && matchEnd;
        });

        renderDataList(filtered);
    }

    function exportExcel() {
        if (allDeliveryData.length === 0) {
            alert('다운로드할 데이터가 없습니다.');
            return;
        }

        let csv = '\uFEFF발생일,납품번호,차량번호,가옥구조,지역,층수,청구댓수,총합계금액,사용불가사유\n';
        allDeliveryData.forEach(d => {
            csv += `"${d.date}","${d.delivery_id}","${d.car_id}","${d.house_type}","${d.region}","${d.floor}","${d.quantity}","${d.totalPrice}","${(d.reason_detail || '').replace(/"/g, '""')}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `양중비관제데이터_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
    }

    function openModal(url) {
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
        modalImg.src = url;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('image-modal').style.display = 'none';
    }
</script>

</body>
</html>
