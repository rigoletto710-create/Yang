<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>가전 배송환경 및 양중비 관제 System</title>
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --text: #1f2937; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 60px; }
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 18px; font-weight: 700; color: var(--primary); }
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 55px; z-index: 90; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; font-size: 15px; font-weight: 600; color: #6b7280; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .container { padding: 15px; display: none; }
        .container.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #4b5563; }
        .form-group label span { color: #ef4444; margin-left: 2px; }
        input[type="text"], input[type="date"], input[type="number"], input[type="password"], select, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: #fff; }
        textarea { resize: vertical; height: 70px; }
        
        .qty-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
        .qty-btn { padding: 14px 0; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; font-weight: bold; color: #4b5563; cursor: pointer; text-align: center; touch-action: manipulation; }
        .qty-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .dynamic-rows { background: #f9fafb; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 10px; display: none; }

        .total-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 8px; font-weight: bold; text-align: right; color: #1e40af; margin-bottom: 15px; }
        .photo-upload { border: 2px dashed #d1d5db; border-radius: 8px; padding: 20px; text-align: center; background: #fff; cursor: pointer; position: relative; }
        .photo-upload input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        #photo-preview { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        #photo-preview img { width: 100%; height: 80px; object-fit: cover; border-radius: 6px; }
        .submit-btn { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
        .submit-btn:disabled { background: #9ca3af; }
        
        .data-item { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 10px; position: relative; }
        .data-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; font-size: 15px; }
        .btn-group-item { display: flex; gap: 5px; }
        .action-btn { border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        .edit-btn { background: #eff6ff; color: #2563eb; }
        .delete-btn { background: #fee2e2; color: #dc2626; }
        
        .img-grid { display: flex; gap: 5px; margin-top: 10px; }
        .img-grid img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; }
        .auth-box { background: #fff; padding: 30px 20px; border-radius: 8px; text-align: center; border: 1px solid #e5e7eb; margin-top: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-card { background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb; text-align: center; }
        .stat-card .title { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .stat-card .value { font-size: 14px; font-weight: bold; color: var(--primary); }
        
        .storage-box { background: #ecfdf5; border: 1px solid #a7f3d0; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; color: #065f46; display: flex; justify-content: space-between; align-items: center; }

        .filter-box { background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 15px; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .filter-row:last-child { margin-bottom: 0; }
        .admin-btn-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .admin-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; color: #fff; touch-action: manipulation; }
        .btn-refresh { background: #4b5563; }
        .btn-excel { background: #059669; }
        .btn-search { background: var(--primary); }
        
        #image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        #image-modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
    </style>

    <!-- Firebase SDK 연동 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJdPArpj_i61crrpEomzpN73euuwh_X84",
            authDomain: "yang-delivery-system.firebaseapp.com",
            projectId: "yang-delivery-system",
            storageBucket: "yang-delivery-system.firebasestorage.app",
            messagingSenderId: "723188059505",
            appId: "1:723188059505:web:35818e40a9a88d34ef7ad0"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            window.db = db;
            window.fbFunctions = { collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy };
        } catch (error) {
            console.error("Firebase 연결 실패:", error);
        }
    </script>
</head>
<body>

<header>
    <h1>가전 배송환경 및 양중비 관제 System</h1>
</header>

<div class="tabs">
    <button class="tab-btn active" data-tab="input">현장 입력 (기사님용)</button>
    <button class="tab-btn" data-tab="dashboard">조회 (관리자용)</button>
</div>

<!-- 기사님 입력 화면 -->
<div id="input-container" class="container active">
    <form id="delivery-form">
        <div class="form-group">
            <label>발생일<span>*</span></label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label>납품번호<span>*</span></label>
            <input type="text" id="delivery_id" placeholder="예: 7123456789" required>
        </div>
        <div class="form-group">
            <label>차량번호<span>*</span></label>
            <input type="text" id="car_id" placeholder="예: 대구81아1234" required>
        </div>
        <div class="form-group">
            <label>가옥구조<span>*</span></label>
            <select id="house_type" required>
                <option value="">선택</option>
                <option value="아파트">아파트</option>
                <option value="단독주택">단독주택</option>
                <option value="상가">상가</option>
                <option value="빌라">빌라</option>
                <option value="기타">기타</option>
            </select>
        </div>
        <div class="form-group">
            <label>지역<span>*</span></label>
            <input type="text" id="region" placeholder="예: 해운대구 우동" required>
        </div>
        <div class="form-group">
            <label>층수<span>*</span></label>
            <input type="number" id="floor" placeholder="예: 5" required>
        </div>
        
        <div class="form-group">
            <label>양중비청구 댓수 선택 (1~5대)<span>*</span></label>
            <input type="hidden" id="quantity" value="" required>
            <div class="qty-grid" id="qty-btn-container">
                <button type="button" class="qty-btn" data-num="1">1대</button>
                <button type="button" class="qty-btn" data-num="2">2대</button>
                <button type="button" class="qty-btn" data-num="3">3대</button>
                <button type="button" class="qty-btn" data-num="4">4대</button>
                <button type="button" class="qty-btn" data-num="5">5대</button>
            </div>
        </div>

        <!-- 1~5대 입력 폼 미리 생성 -->
        <div id="dynamic-items-container">
            <div class="dynamic-rows" data-index="1">
                <label style="font-size:13px; font-weight:bold; color:#2563eb; margin-bottom:8px; display:block;">[ 1번째 제품 정보 ]</label>
                <div style="margin-bottom:8px;"><input type="text" placeholder="모델명 입력 (예: RF85C9011AP)" class="item-model"></div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><input type="number" placeholder="제품무게 (kg)" class="item-weight"></div>
                    <div style="flex:1;"><input type="number" placeholder="결제금액 (원)" class="item-price"></div>
                </div>
            </div>
            <div class="dynamic-rows" data-index="2">
                <label style="font-size:13px; font-weight:bold; color:#2563eb; margin-bottom:8px; display:block;">[ 2번째 제품 정보 ]</label>
                <div style="margin-bottom:8px;"><input type="text" placeholder="모델명 입력" class="item-model"></div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><input type="number" placeholder="제품무게 (kg)" class="item-weight"></div>
                    <div style="flex:1;"><input type="number" placeholder="결제금액 (원)" class="item-price"></div>
                </div>
            </div>
            <div class="dynamic-rows" data-index="3">
                <label style="font-size:13px; font-weight:bold; color:#2563eb; margin-bottom:8px; display:block;">[ 3번째 제품 정보 ]</label>
                <div style="margin-bottom:8px;"><input type="text" placeholder="모델명 입력" class="item-model"></div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><input type="number" placeholder="제품무게 (kg)" class="item-weight"></div>
                    <div style="flex:1;"><input type="number" placeholder="결제금액 (원)" class="item-price"></div>
                </div>
            </div>
            <div class="dynamic-rows" data-index="4">
                <label style="font-size:13px; font-weight:bold; color:#2563eb; margin-bottom:8px; display:block;">[ 4번째 제품 정보 ]</label>
                <div style="margin-bottom:8px;"><input type="text" placeholder="모델명 입력" class="item-model"></div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><input type="number" placeholder="제품무게 (kg)" class="item-weight"></div>
                    <div style="flex:1;"><input type="number" placeholder="결제금액 (원)" class="item-price"></div>
                </div>
            </div>
            <div class="dynamic-rows" data-index="5">
                <label style="font-size:13px; font-weight:bold; color:#2563eb; margin-bottom:8px; display:block;">[ 5번째 제품 정보 ]</label>
                <div style="margin-bottom:8px;"><input type="text" placeholder="모델명 입력" class="item-model"></div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><input type="number" placeholder="제품무게 (kg)" class="item-weight"></div>
                    <div style="flex:1;"><input type="number" placeholder="결제금액 (원)" class="item-price"></div>
                </div>
            </div>
        </div>

        <div class="total-box" id="total-amount-box">
            총 합계금액: 0 원
        </div>

        <div class="form-group">
            <label>특수장비사용불가 (양중비 결제 상세 사유)<span>*</span></label>
            <textarea id="reason_detail" placeholder="상세내용" required></textarea>
        </div>
        <div class="form-group">
            <label>환경사진 업로드 (최대 3장)<span>*</span></label>
            <div class="photo-upload">
                <p>📷 사진 촬영 또는 파일 선택</p>
                <input type="file" id="photos" accept="image/*" multiple required>
            </div>
            <div id="photo-preview"></div>
        </div>
        <button type="submit" id="submit-btn" class="submit-btn">클라우드로 전송 및 등록</button>
    </form>
</div>

<!-- 관리자 조회 화면 -->
<div id="dashboard-container" class="container">
    <div id="auth-box" class="auth-box">
        <h3 style="margin-bottom: 15px; color: #1f2937;">🔒 관리자 인증</h3>
        <p style="margin-bottom: 15px; font-size: 14px; color: #6b7280;">관리자 비밀번호를 입력해주세요.</p>
        <input type="password" id="admin-pw" placeholder="비밀번호 입력" style="margin-bottom: 15px; text-align: center; font-size: 18px; letter-spacing: 3px;">
        <button class="submit-btn" id="auth-btn">확인</button>
    </div>

    <div id="dashboard-content" style="display: none;">
        <div class="storage-box" id="storage-status">
            <span>💾 클라우드 사용량 계산 중...</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="title">📅 오늘 (일일)</div>
                <div class="value" id="stat-daily">0건 / 0원</div>
            </div>
            <div class="stat-card">
                <div class="title">📆 이번 달</div>
                <div class="value" id="stat-monthly">0건 / 0원</div>
            </div>
            <div class="stat-card" style="grid-column: span 2;">
                <div class="title">📊 검색/조회 결과 요약</div>
                <div class="value" id="stat-total-summary">0건 / 0원</div>
            </div>
        </div>

        <div class="filter-box">
            <div class="filter-row">
                <input type="text" id="filter-keyword" placeholder="납품번호, 차량번호, 지역 검색" style="font-size: 14px; padding: 8px;">
            </div>
            <div class="filter-row">
                <input type="date" id="filter-start-date" style="font-size: 14px; padding: 8px;">
                <input type="date" id="filter-end-date" style="font-size: 14px; padding: 8px;">
            </div>
            <button class="admin-btn btn-search" id="search-btn" style="width:100%; margin-top:8px; padding:10px;">🔍 검색 실행</button>
        </div>

        <div class="admin-btn-group">
            <button class="admin-btn btn-refresh" id="refresh-btn">🔄 전체목록 새로고침</button>
            <button class="admin-btn btn-excel" id="excel-btn">📊 엑셀 다운로드</button>
        </div>

        <div id="data-list">데이터를 불러오는 중입니다...</div>
    </div>
</div>

<!-- 이미지 확대 모달 -->
<div id="image-modal" onclick="closeModal()">
    <img id="modal-img" src="">
</div>

<script>
    let compressedPhotos = [];
    let allDeliveryData = [];

    document.addEventListener('DOMContentLoaded', () => {
        const dateInput = document.getElementById('date');
        if(dateInput) dateInput.value = new Date().toISOString().split('T')[0];

        // 탭 전환 이벤트 바인딩
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tabName = e.target.getAttribute('data-tab');
                document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                const targetContainer = document.getElementById(tabName + '-container');
                if(targetContainer) targetContainer.classList.add('active');
                e.target.classList.add('active');
            });
        });

        // 댓수 버튼(1~5대) 터치/클릭 이벤트 바인딩
        document.querySelectorAll('.qty-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const num = parseInt(e.target.getAttribute('data-num'));
                selectQuantity(num);
            });
        });

        // 관리자 인증 버튼 및 엔터키
        const authBtn = document.getElementById('auth-btn');
        if(authBtn) authBtn.addEventListener('click', checkPassword);
        
        const adminPw = document.getElementById('admin-pw');
        if(adminPw) {
            adminPw.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') checkPassword();
            });
        }

        // 검색, 새로고침, 엑셀 버튼 바인딩
        const searchBtn = document.getElementById('search-btn');
        if(searchBtn) searchBtn.addEventListener('click', filterData);
        
        const refreshBtn = document.getElementById('refresh-btn');
        if(refreshBtn) refreshBtn.addEventListener('click', loadData);
        
        const excelBtn = document.getElementById('excel-btn');
        if(excelBtn) excelBtn.addEventListener('click', exportExcel);

        // 금액 입력 시 실시간 계산 바인딩
        document.querySelectorAll('.item-price').forEach(input => {
            input.addEventListener('input', calculateTotal);
        });

        // 사진 업로드
        const photosInput = document.getElementById('photos');
        if(photosInput) {
            photosInput.addEventListener('change', (e) => {
                const preview = document.getElementById('photo-preview');
                if(!preview) return;
                preview.innerHTML = '';
                compressedPhotos = [];
                Array.from(e.target.files).slice(0, 3).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 600;
                            let width = img.width, height = img.height;
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                            compressedPhotos.push(dataUrl);
                            const previewImg = document.createElement('img');
                            previewImg.src = dataUrl;
                            preview.appendChild(previewImg);
                        };
                    };
                    reader.readAsDataURL(file);
                });
            });
        }

        // 폼 제출
        const deliveryForm = document.getElementById('delivery-form');
        if(deliveryForm) {
            deliveryForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const qtyVal = document.getElementById('quantity').value;
                if (!qtyVal) { alert('양중비청구 댓수를 선택해주세요.'); return; }

                const submitBtn = document.getElementById('submit-btn');
                submitBtn.disabled = true;
                submitBtn.innerText = '안전하게 전송 중...';

                try {
                    let totalPrice = 0;
                    const items = [];
                    const rows = document.querySelectorAll('.dynamic-rows');
                    rows.forEach((row) => {
                        if (row.style.display === 'block') {
                            const m = row.querySelector('.item-model').value;
                            const w = row.querySelector('.item-weight').value;
                            const p = parseFloat(row.querySelector('.item-price').value) || 0;
                            totalPrice += p;
                            items.push({ model: m, weight: w, price: p });
                        }
                    });

                    const { collection, addDoc } = window.fbFunctions;
                    await addDoc(collection(window.db, "deliveries"), {
                        date: document.getElementById('date').value,
                        delivery_id: document.getElementById('delivery_id').value,
                        car_id: document.getElementById('car_id').value,
                        house_type: document.getElementById('house_type').value,
                        region: document.getElementById('region').value,
                        floor: document.getElementById('floor').value,
                        quantity: qtyVal,
                        items: items,
                        totalPrice: totalPrice,
                        reason_detail: document.getElementById('reason_detail').value,
                        photos: compressedPhotos,
                        createdAt: new Date()
                    });

                    alert('성공적으로 저장되었습니다!');
                    e.target.reset();
                    document.getElementById('quantity').value = '';
                    document.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.dynamic-rows').forEach(r => r.style.display = 'none');
                    document.getElementById('total-amount-box').innerText = '총 합계금액: 0 원';
                    document.getElementById('photo-preview').innerHTML = '';
                    compressedPhotos = [];
                } catch (err) {
                    alert('업로드 실패: ' + err.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = '클라우드로 전송 및 등록';
                }
            });
        }
    });

    function selectQuantity(num) {
        const qtyInput = document.getElementById('quantity');
        if(qtyInput) qtyInput.value = num;

        document.querySelectorAll('.qty-btn').forEach((btn, idx) => {
            if (idx + 1 === num) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        const rows = document.querySelectorAll('.dynamic-rows');
        rows.forEach((row) => {
            const idx = parseInt(row.getAttribute('data-index'));
            const modelInput = row.querySelector('.item-model');
            const weightInput = row.querySelector('.item-weight');
            const priceInput = row.querySelector('.item-price');

            if (idx <= num) {
                row.style.display = 'block';
                if(modelInput) modelInput.setAttribute('required', 'true');
                if(weightInput) weightInput.setAttribute('required', 'true');
                if(priceInput) priceInput.setAttribute('required', 'true');
            } else {
                row.style.display = 'none';
                if(modelInput) { modelInput.removeAttribute('required'); modelInput.value = ''; }
                if(weightInput) { weightInput.removeAttribute('required'); weightInput.value = ''; }
                if(priceInput) { priceInput.removeAttribute('required'); priceInput.value = ''; }
            }
        });
        calculateTotal();
    }

    function calculateTotal() {
        let total = 0;
        document.querySelectorAll('.dynamic-rows').forEach((row) => {
            if (row.style.display === 'block') {
                const priceInput = row.querySelector('.item-price');
                if(priceInput) total += parseFloat(priceInput.value) || 0;
            }
        });
        const totalBox = document.getElementById('total-amount-box');
        if(totalBox) totalBox.innerText = `총 합계금액: ${total.toLocaleString()} 원`;
    }

    function checkPassword() {
        const pwInput = document.getElementById('admin-pw');
        if (!pwInput) return;
        if (pwInput.value === '0530') {
            const authBox = document.getElementById('auth-box');
            const dashContent = document.getElementById('dashboard-content');
            if(authBox) authBox.style.display = 'none';
            if(dashContent) dashContent.style.display = 'block';
            loadData();
        } else {
            alert('비밀번호가 틀렸습니다!');
            pwInput.value = '';
        }
    }

    async function loadData() {
        const list = document.getElementById('data-list');
        if(list) list.innerHTML = '불러오는 중...';

        try {
            const { collection, getDocs, query, orderBy } = window.fbFunctions;
            const q = query(collection(window.db, "deliveries"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);

            allDeliveryData = [];
            querySnapshot.forEach((docSnap) => {
                allDeliveryData.push({ id: docSnap.id, ...docSnap.data() });
            });

            const kw = document.getElementById('filter-keyword');
            const sd = document.getElementById('filter-start-date');
            const ed = document.getElementById('filter-end-date');
            if(kw) kw.value = '';
            if(sd) sd.value = '';
            if(ed) ed.value = '';

            renderDataList(allDeliveryData);
            updateGlobalStats(allDeliveryData);
        } catch (err) {
            if(list) list.innerHTML = '데이터 로딩 실패: ' + err.message;
        }
    }

    function renderDataList(dataArray) {
        const list = document.getElementById('data-list');
        if(!list) return;
        list.innerHTML = '';

        if (dataArray.length === 0) {
            list.innerHTML = '등록된 데이터가 없습니다.';
            return;
        }

        dataArray.forEach((data) => {
            const el = document.createElement('div');
            el.className = 'data-item';
            
            let itemsHtml = '';
            if(data.items && data.items.length > 0) {
                itemsHtml = data.items.map((item, idx) => `&nbsp;&nbsp;- ${idx+1}번: [${item.model}] 무게 ${item.weight}kg / 금액 ${Number(item.price).toLocaleString()}원<br>`).join('');
            }

            el.innerHTML = `
                <div class="data-item-header">
                    <span>납품번호: ${data.delivery_id} (${data.car_id})</span>
                    <div class="btn-group-item">
                        <button class="action-btn edit-btn" onclick="editItem('${data.id}')">✏️ 수정</button>
                        <button class="action-btn delete-btn" onclick="deleteItem('${data.id}')">🗑️ 삭제</button>
                    </div>
                </div>
                <p><b>발생일:</b> ${data.date}</p>
                <p><b>지역:</b> ${data.region} (${data.house_type} ${data.floor}층)</p>
                <p><b>청구 대수:</b> 총 ${data.quantity}대</p>
                <p><b>제품별 상세 내역:</b><br>${itemsHtml}</p>
                <p style="color:#2563eb; font-weight:bold;"><b>총 합계금액:</b> ${Number(data.totalPrice || 0).toLocaleString()} 원</p>
                <p><b>사용불가 사유:</b> ${data.reason_detail}</p>
                <div class="img-grid">
                    ${(data.photos || []).map(url => `<img src="${url}" onclick="openModal('${url}')">`).join('')}
                </div>
            `;
            list.appendChild(el);
        });
    }

    async function deleteItem(docId) {
        if (!confirm('정말 이 데이터를 삭제하시겠습니까?')) return;
        try {
            const { doc, deleteDoc } = window.fbFunctions;
            await deleteDoc(doc(window.db, "deliveries", docId));
            alert('삭제되었습니다.');
            loadData();
        } catch (err) {
            alert('삭제 실패: ' + err.message);
        }
    }

    async function editItem(docId) {
        const target = allDeliveryData.find(d => d.id === docId);
        if(!target) return;

        const newDeliveryId = prompt("납품번호를 수정하세요:", target.delivery_id);
        if (newDeliveryId === null) return;
        const newCarId = prompt("차량번호를 수정하세요:", target.car_id);
        if (newCarId === null) return;
        const newRegion = prompt("지역을 수정하세요:", target.region);
        if (newRegion === null) return;
        const newFloor = prompt("층수를 수정하세요:", target.floor);
        if (newFloor === null) return;
        const newQty = prompt("청구 댓수를 수정하세요 (1~5):", target.quantity);
        if (newQty === null) return;
        const newPrice = prompt("총 합계금액을 수정하세요:", target.totalPrice);
        if (newPrice === null) return;
        const newReason = prompt("사용불가 사유를 수정하세요:", target.reason_detail);
        if (newReason === null) return;

        try {
            const { doc, updateDoc } = window.fbFunctions;
            await updateDoc(doc(window.db, "deliveries", docId), {
                delivery_id: newDeliveryId,
                car_id: newCarId,
                region: newRegion,
                floor: newFloor,
                quantity: newQty,
                totalPrice: parseFloat(newPrice) || 0,
                reason_detail: newReason
            });
            alert('성공적으로 수정되었습니다.');
            loadData();
        } catch (err) {
            alert('수정 실패: ' + err.message);
        }
    }

    function updateGlobalStats(targetArray) {
        let approxBytes = 0;
        allDeliveryData.forEach(d => { approxBytes += JSON.stringify(d).length; });

        const kb = (approxBytes / 1024).toFixed(1);
        const mb = (approxBytes / (1024 * 1024)).toFixed(2);
        const usageText = mb >= 1 ? `${mb} MB` : `${kb} KB`;
        const freeMb = Math.max(0, 1024 - (approxBytes / (1024 * 1024))).toFixed(2);

        const storageStatus = document.getElementById('storage-status');
        if(storageStatus) {
            storageStatus.innerHTML = `<span>💾 <b>사용 용량:</b> ${usageText}</span><span><b>무료 잔여량:</b> 약 ${freeMb} MB (총 1GB)</span>`;
        }

        const todayStr = new Date().toISOString().split('T')[0];
        const currentMonthStr = todayStr.substring(0, 7);

        let dailyCount = 0, dailySum = 0;
        let monthCount = 0, monthSum = 0;
        let targetSum = 0;

        targetArray.forEach(d => {
            const price = Number(d.totalPrice || 0);
            targetSum += price;

            if (d.date === todayStr) {
                dailyCount++;
                dailySum += price;
            }
            if (d.date && d.date.startsWith(currentMonthStr)) {
                monthCount++;
                monthSum += price;
            }
        });

        const statDaily = document.getElementById('stat-daily');
        const statMonthly = document.getElementById('stat-monthly');
        const statSummary = document.getElementById('stat-total-summary');
        if(statDaily) statDaily.innerText = `${dailyCount}건 / ${dailySum.toLocaleString()}원`;
        if(statMonthly) statMonthly.innerText = `${monthCount}건 / ${monthSum.toLocaleString()}원`;
        if(statSummary) statSummary.innerText = `${targetArray.length}건 / ${targetSum.toLocaleString()}원`;
    }

    function filterData() {
        const keywordInput = document.getElementById('filter-keyword');
        const startInput = document.getElementById('filter-start-date');
        const endInput = document.getElementById('filter-end-date');

        const keyword = keywordInput ? keywordInput.value.toLowerCase().trim() : '';
        const startDate = startInput ? startInput.value : '';
        const endDate = endInput ? endInput.value : '';

        const filtered = allDeliveryData.filter(item => {
            const matchKeyword = !keyword || 
                (item.delivery_id && item.delivery_id.toLowerCase().includes(keyword)) ||
                (item.car_id && item.car_id.toLowerCase().includes(keyword)) ||
                (item.region && item.region.toLowerCase().includes(keyword));

            const itemDate = item.date || '';
            const matchStart = !startDate || itemDate >= startDate;
            const matchEnd = !endDate || itemDate <= endDate;

            return matchKeyword && matchStart && matchEnd;
        });

        renderDataList(filtered);
        updateGlobalStats(filtered);
    }

    function exportExcel() {
        if (allDeliveryData.length === 0) { alert('다운로드할 데이터가 없습니다.'); return; }
        let csv = '\uFEFF발생일,납품번호,차량번호,가옥구조,지역,층수,청구댓수,총합계금액,사용불가사유\n';
        allDeliveryData.forEach(d => {
            csv += `"${d.date}","${d.delivery_id}","${d.car_id}","${d.house_type}","${d.region}","${d.floor}","${d.quantity}","${d.totalPrice}","${(d.reason_detail || '').replace(/"/g, '""')}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `양중비관제데이터_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
    }

    function openModal(url) {
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
        if(modal && modalImg) { modalImg.src = url; modal.style.display = 'flex'; }
    }

    function closeModal() {
        const modal = document.getElementById('image-modal');
        if(modal) modal.style.display = 'none';
    }
</script>
