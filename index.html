<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>가전 배송환경 및 양중비 관제 System</title>
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --text: #1f2937; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 60px; }
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 18px; font-weight: 700; color: var(--primary); }
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 55px; z-index: 90; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; font-size: 15px; font-weight: 600; color: #6b7280; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .container { padding: 15px; display: none; }
        .container.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #4b5563; }
        .form-group label span { color: #ef4444; margin-left: 2px; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
        textarea { resize: vertical; height: 80px; }
        .photo-upload { border: 2px dashed #d1d5db; border-radius: 8px; padding: 20px; text-align: center; background: #fff; cursor: pointer; position: relative; }
        .photo-upload input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        #photo-preview { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        #photo-preview img { width: 100%; height: 80px; object-fit: cover; border-radius: 6px; }
        .submit-btn { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .submit-btn:disabled { background: #9ca3af; }
        .data-item { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 10px; }
        .data-item-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .img-grid { display: flex; gap: 5px; margin-top: 10px; }
        .img-grid img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    </style>

    <!-- Firebase SDK 연동 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // 사용자님의 파이어베이스 설정값 적용 완료
        const firebaseConfig = {
            apiKey: "AIzaSyBJdPArpj_i61crrpEomzpN73euuwh_X84",
            authDomain: "yang-delivery-system.firebaseapp.com",
            projectId: "yang-delivery-system",
            storageBucket: "yang-delivery-system.firebasestorage.app",
            messagingSenderId: "723188059505",
            appId: "1:723188059505:web:35818e40a9a88d34ef7ad0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.db = db;
        window.storage = storage;
        window.fbFunctions = { collection, addDoc, getDocs, query, orderBy, ref, uploadString, getDownloadURL };
    </script>
</head>
<body>

<header>
    <h1>가전 배송환경 및 양중비 관제 (Cloud)</h1>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="openTab('input')">현장 입력 (기사님용)</button>
    <button class="tab-btn" onclick="openTab('dashboard')">조회 (관리자용)</button>
</div>

<!-- 기사님 입력 화면 -->
<div id="input-container" class="container active">
    <form id="delivery-form">
        <div class="form-group">
            <label>발생일<span>*</span></label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label>센터<span>*</span></label>
            <select id="center" required>
                <option value="">선택</option>
                <option value="양산센터">양산센터</option>
                <option value="부산센터">부산센터</option>
                <option value="김해센터">김해센터</option>
            </select>
        </div>
        <div class="form-group">
            <label>납품번호<span>*</span></label>
            <input type="text" id="delivery_id" placeholder="예: 80123456" required>
        </div>
        <div class="form-group">
            <label>차량번호<span>*</span></label>
            <input type="text" id="car_id" placeholder="예: 12가 3456" required>
        </div>
        <div class="form-group">
            <label>양중비 결제 상세 사유<span>*</span></label>
            <textarea id="reason_detail" placeholder="상세 사유 입력" required></textarea>
        </div>
        <div class="form-group">
            <label>환경사진 업로드 (최대 3장)<span>*</span></label>
            <div class="photo-upload">
                <p>📷 사진 촬영 또는 파일 선택</p>
                <input type="file" id="photos" accept="image/*" multiple required>
            </div>
            <div id="photo-preview"></div>
        </div>
        <button type="submit" id="submit-btn" class="submit-btn">클라우드로 전송 및 등록</button>
    </form>
</div>

<!-- 관리자 조회 화면 -->
<div id="dashboard-container" class="container">
    <button class="submit-btn" onclick="loadData()" style="margin-bottom:15px;">🔄 데이터 새로고침</button>
    <div id="data-list">데이터를 불러오는 중입니다...</div>
</div>

<script>
    let compressedPhotos = [];

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    });

    function openTab(tabName) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName + '-container').classList.add('active');
        event.currentTarget.classList.add('active');
        if (tabName === 'dashboard') loadData();
    }

    // 이미지 자동 압축
    document.getElementById('photos').addEventListener('change', (e) => {
        const preview = document.getElementById('photo-preview');
        preview.innerHTML = '';
        compressedPhotos = [];

        const files = Array.from(e.target.files).slice(0, 3);
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    compressedPhotos.push(dataUrl);

                    const previewImg = document.createElement('img');
                    previewImg.src = dataUrl;
                    preview.appendChild(previewImg);
                };
            };
            reader.readAsDataURL(file);
        });
    });

    // Firebase 전송
    document.getElementById('delivery-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = '사진 압축 및 클라우드 업로드 중...';

        try {
            const photoUrls = [];
            const { ref, uploadString, getDownloadURL, collection, addDoc } = window.fbFunctions;

            for (let i = 0; i < compressedPhotos.length; i++) {
                const photoRef = ref(window.storage, `photos/${Date.now()}_${i}.jpg`);
                await uploadString(photoRef, compressedPhotos[i], 'data_url');
                const url = await getDownloadURL(photoRef);
                photoUrls.push(url);
            }

            await addDoc(collection(window.db, "deliveries"), {
                date: document.getElementById('date').value,
                center: document.getElementById('center').value,
                delivery_id: document.getElementById('delivery_id').value,
                car_id: document.getElementById('car_id').value,
                reason_detail: document.getElementById('reason_detail').value,
                photos: photoUrls,
                createdAt: new Date()
            });

            alert('Firebase 클라우드에 성공적으로 저장되었습니다!');
            e.target.reset();
            document.getElementById('photo-preview').innerHTML = '';
            compressedPhotos = [];
        } catch (err) {
            console.error(err);
            alert('업로드 실패: ' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = '클라우드로 전송 및 등록';
        }
    });

    // 관리자 데이터 불러오기
    async function loadData() {
        const list = document.getElementById('data-list');
        list.innerHTML = '불러오는 중...';

        try {
            const { collection, getDocs, query, orderBy } = window.fbFunctions;
            const q = query(collection(window.db, "deliveries"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);

            list.innerHTML = '';
            if (querySnapshot.empty) {
                list.innerHTML = '등록된 데이터가 없습니다.';
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const el = document.createElement('div');
                el.className = 'data-item';
                el.innerHTML = `
                    <div class="data-item-header">
                        <span>${data.delivery_id} (${data.car_id})</span>
                        <span>${data.date}</span>
                    </div>
                    <p><b>센터:</b> ${data.center}</p>
                    <p><b>사유:</b> ${data.reason_detail}</p>
                    <div class="img-grid">
                        ${data.photos.map(url => `<a href="${url}" target="_blank"><img src="${url}"></a>`).join('')}
                    </div>
                `;
                list.appendChild(el);
            });
        } catch (err) {
            list.innerHTML = '데이터 로딩 실패: ' + err.message;
        }
    }
</script>

</body>
</html>
